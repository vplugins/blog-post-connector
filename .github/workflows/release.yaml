name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for the release (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Latest version

    - name: Cache Composer dependencies
      uses: actions/cache@v3
      with:
        path: ~/.composer/cache
        key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: composer-${{ runner.os }}-

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        tools: composer

    - name: Install Composer dependencies without dev
      run: |
        COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --prefer-dist --optimize-autoloader

    - name: Get version from user input
      run: |
        VERSION=${{ github.event.inputs.version }}
        if [[ $VERSION != v* ]]; then
          VERSION="v${VERSION}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Prepare package directory with only dependencies
      run: |
        mkdir package
        cp -r vendor package/
        cp composer.json composer.lock package/

    - name: Create ZIP package (dependencies only)
      run: |
        cd package
        zip -r ../blog-post-connector-dependencies.zip . 

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      with:
        tag_name: ${{ env.VERSION }}
        release_name: Blog Post Connector Dependencies ${{ env.VERSION }}
        body: "Release containing only dependencies for Blog Post Connector version ${{ env.VERSION }}."
        draft: false
        prerelease: false

    - name: Upload ZIP to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./blog-post-connector-dependencies.zip
        asset_name: blog-post-connector-dependencies.zip
        asset_content_type: application/zip
