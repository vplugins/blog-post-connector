name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for the release (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

# Lets the built-in GITHUB_TOKEN create tags/releases. No PAT needed.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        tools: composer

    - name: Install Composer dependencies without dev
      run: composer install --no-dev

    - name: Normalise version tag
      run: |
        VERSION="${{ github.event.inputs.version }}"
        if [[ $VERSION != v* ]]; then
          VERSION="v${VERSION}"
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Cleanup unnecessary files
      run: |
        rm -f composer.json composer.lock package.json package-lock.json readme.md README.md

    - name: Zip the plugin
      # The files go inside a blog-post-connector/ folder so WordPress installs the zip into
      # wp-content/plugins/blog-post-connector/. Without it, WordPress names the folder after
      # the zip file (sm-post-connector-package/), as happened with the 1.0.6 and 1.0.7 releases.
      run: |
        mkdir -p build/blog-post-connector
        rsync -a . build/blog-post-connector \
          --exclude='.git*' --exclude=build --exclude=tests --exclude=docs \
          --exclude=phpunit.xml --exclude='*.yml' --exclude='*.yaml'
        cd build
        zip -r blog-post-connector-package.zip blog-post-connector

    - name: Create release and upload asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: Blog Post Connector Plugin ${{ env.VERSION }}
        body: "Release of Blog Post Connector plugin version ${{ env.VERSION }}."
        draft: false
        prerelease: false
        files: build/blog-post-connector-package.zip
