name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for the release (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Latest version supporting Node.js 20

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        tools: composer

    - name: Install Composer dependencies without dev
      run: composer install --no-dev --prefer-dist --no-progress --no-suggest

    - name: Get version from user input
      run: |
        VERSION=${{ github.event.inputs.version }}
        # Ensure that the version is prefixed with "v" for a valid tag name
        if [[ $VERSION != v* ]]; then
          VERSION="v${VERSION}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Prepare Build Directory
      run: |
        mkdir -p build/blog-post-connector
        rsync -av . build/blog-post-connector \
          --exclude=.git --exclude=.github --exclude=tests --exclude=docs \
          --exclude=node_modules --exclude=phpunit.xml --exclude=*.yml \
          --exclude=*.md --exclude=composer.lock --exclude=package-lock.json

    - name: Zip the plugin
      run: |
        cd build
        zip -r blog-post-connector-package.zip blog-post-connector

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      with:
        tag_name: ${{ env.VERSION }}
        release_name: Blog Post Connector Plugin ${{ env.VERSION }}
        body: "Release of Blog Post Connector plugin version ${{ env.VERSION }}."
        draft: false
        prerelease: false

    - name: Upload to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: build/blog-post-connector-package.zip
        asset_name: blog-post-connector-package.zip
        asset_content_type: application/zip
